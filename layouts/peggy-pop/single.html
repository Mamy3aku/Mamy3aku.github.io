{{ partial "header.html" . }}
{{ partial "breadcrumb.html" . }}
<main class="peggy">
  <h1>{{ .Title }}</h1>
  <figure class="peggy-detail-image">
    {{ partial "thumb2.html" (dict "Page" . "Image" .Params.image "Alt" (printf "%sの画像" .Params.category)) }}
    <figcaption>グッズの画像</figcaption>
  </figure>
  <dl class="peggy-detail-meta">
    <dt>種類</dt><dd>{{ .Params.category }}</dd>
    <dt>製造年</dt><dd>{{ .Params.production_year }}</dd>
    <dt>入手日</dt><dd>{{ .Params.acquired_date }}</dd>
    <dt>概要</dt><dd>{{ .Params.summary }}</dd>
  </dl>
  <div class="peggy-detail-body">{{ .Content }}</div>
  <p><a href="{{ .Parent.RelPermalink }}">← グッズ一覧に戻る</a></p>
</main>
{{ partial "footer.html" . }}
